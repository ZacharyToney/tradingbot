[project]
name = "tradingbot"
version = "0.1.0"
description = "Paper-first algorithmic trading bot on Alpaca (US equities + crypto)"
readme = "README.md"
authors = [
    { name = "zacharytoney", email = "ZacharyToney@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.43.4",
    "loguru>=0.7.3",
    "ntplib>=0.4.0",
    "numpy>=2.4.5",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
]

[project.scripts]
tb = "tradingbot.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.13",
    "streamlit>=1.57.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
